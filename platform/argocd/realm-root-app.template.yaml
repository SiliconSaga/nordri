# Generic realm root-app. lib/gitops.sh (gitops_apply_root_apps, run by
# bootstrap.sh and migrate.sh) substitutes __REALM_REPO__ with the owning
# realm's name and __REALM_REPO_URL__ with that repository's URL under the
# realm's org at the stable git address, then applies it. nordri never commits
# a realm-specific value — this file stays realm-agnostic.
#
# The realm repository holds the WHOLE realm checkout, as Forgejo's mirror
# does, so path is "cluster" (Phase 3 design, Decision 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __REALM_REPO__
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: '__REALM_REPO_URL__'
    targetRevision: HEAD
    path: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The realm config (e.g. KeycloakRealmImport, ExternalSecret) depends on CRDs
    # the platform installs (Keycloak operator, ESO). This is a SEPARATE
    # Application from nidavellir's, so cross-app sync-waves don't order it —
    # instead ArgoCD retries until those CRDs exist, and
    # SkipDryRunOnMissingResource avoids a hard dry-run failure meanwhile.
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
