apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Shared Apps
  - ../../apps/traefik.yaml
  - ../../apps/crossplane.yaml

  # GKE Specific Apps
  # Velero is environment-specific, not shared: GCP plugin + GCS + Workload
  # Identity here, AWS plugin + Garage on homelab. Including the homelab file
  # here (as this overlay used to) points Velero at a Garage Service that does
  # not exist on GKE, so it runs and stores nothing.
  - ../../apps/velero-gke.yaml

  # Shared Manifests
  - ../../manifests/crossplane-providers.yaml
  - ../../manifests/crossplane-configs.yaml

  # GKE Specific Manifests
  - ../../manifests/cluster-identity-gke.yaml
  # Note: Gateway API CRDs, Traefik Gateway resource, and ClusterIssuers are
  # managed by the Nidavellir platform component, not Nordri. cert-manager
  # itself is pre-installed on this cluster and also excluded.

  # GKE Specific Ingress Routes
  - ../../ingress/gitea-gke.yaml
  # gitea TLS is covered by the platform wildcard cert (*.cmdbee.org) issued by
  # Vegvísir — no per-host Certificate. See SiliconSaga/yggdrasil#65.
