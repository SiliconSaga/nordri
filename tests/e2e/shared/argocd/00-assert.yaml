# tests/e2e/shared/argocd/00-assert.yaml
# Assert nordri-owned ArgoCD applications are Synced and Healthy.
# nidavellir-owned apps (nidavellir, vegvisir, cert-manager) are asserted
# in nidavellir's own kuttl tests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nordri-root
  namespace: argo
status:
  health:
    status: Healthy
  sync:
    status: Synced
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer4-fundamentals
  namespace: argo
status:
  health:
    status: Healthy
  sync:
    status: Synced
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argo
status:
  health:
    status: Healthy
  sync:
    status: Synced
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argo
status:
  health:
    status: Healthy
  sync:
    status: Synced
---
# ArgoCD adopting its own Layer 3 release (apps/argocd.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argo
status:
  health:
    status: Healthy
  sync:
    status: Synced
---
# controller.metrics.enabled — the Service Heimdall scrapes for argocd_app_info.
apiVersion: v1
kind: Service
metadata:
  name: argocd-application-controller-metrics
  namespace: argo
spec:
  ports:
    - name: http-metrics
      port: 8082
